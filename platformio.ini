; BUCK firmware. ESP32-C3 SuperMini, Arduino core 3.3.12 through pioarduino.
;
;   pio run -e buck -t upload       your own build: set WiFi and an id over serial after flashing
;   pio run -e heatsync -t upload   the head on the wall at HeatSync Labs
;   pio test -e native              protocol unit tests on your computer
;   pio device monitor              serial console at 115200

[platformio]
default_envs = buck

[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=1
build_src_flags =
  -Wall
  -Wextra
  -Wno-missing-field-initializers

; Your own BUCK. Nothing is preset: after flashing, send /wifi and /id over serial,
; then calibrate the jaw (docs/BUILD.md walks through it).
[env:buck]
extends = esp32

; The BUCK on the wall at HeatSync Labs, Mesa AZ. Calibrated on 2026-10-07.
; The HeatSync WiFi password is public, so it lives here in the open.
[env:heatsync]
extends = esp32
build_flags =
  ${esp32.build_flags}
  -DBUCK_DEFAULT_ID=\"heatsync\"
  -DBUCK_DEFAULT_SSID=\"heatsynclabs\"
  -DBUCK_DEFAULT_PASS=\"hacktheplanet\"
  -DBUCK_DEFAULT_OPEN_US=500
  -DBUCK_DEFAULT_CLOSED_US=730

; Host tests: the CLASP and MQTT codecs, the text filter, and SAM itself through
; the same samTame/samSay path the firmware uses, all under AddressSanitizer and
; UBSan.
[env:native]
platform = native
build_flags = -Wall -DUNITY_INCLUDE_DOUBLE -Itest/stubs -fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer
extra_scripts = pre:test/sanitize.py
test_build_src = no
